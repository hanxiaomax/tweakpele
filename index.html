<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tweakpele — Pele theme &amp; render playground</title>
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="Live-editor for Pele diagram themes (CSS variables) and render options, with a Mermaid source editor and native-zoom preview." />
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./tweakpele.css?v=8b3e079f" />
  <script>
    // apply persisted theme before first paint (no flash)
    try {
      var t = JSON.parse(localStorage.getItem('tweakpele.siteTheme') || '"light"');
      if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
    } catch (e) { /* ignore */ }
  </script>
</head>
<body>
  <div id="root">
    <noscript>tweakpele needs JavaScript — it renders diagrams live in your browser.</noscript>
  </div>

  <script src="./vendor/pele.global.js"></script>
  <script src="./diagrams/bundle.js"></script>
  <script src="./assets/app.js?v=8c751bae"></script>
</body>
</html>
