<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tweakpele — Pele 主题 + 渲染参数实时调节</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./tweakpele.css" />
  <style id="live-theme"></style>
</head>
<body>
  <header class="topbar">
    <h1>tweakpele <small>Pele 主题 + 渲染参数 · 全图表无限画板</small></h1>
    <div class="actions">
      <button type="button" id="btn-copy" title="复制当前 .pele { ... } CSS">复制 .pele CSS</button>
      <button type="button" id="btn-copy-opts" title="复制当前 mount/render 选项 JSON">复制渲染参数</button>
      <button type="button" class="secondary" id="btn-factory">重置 factory</button>
      <button type="button" class="secondary" id="btn-dark">加载深色样例</button>
    </div>
    <span class="status" id="status" aria-live="polite"></span>
  </header>

  <main class="layout">
    <aside class="toolbox">
      <details class="section" open>
        <summary class="panel-head">CSS 变量 <span class="count" id="vars-count"></span></summary>
        <div class="vars-list" id="vars-list"></div>
      </details>
      <details class="section" open>
        <summary class="panel-head">渲染参数 <span class="count">Pele / Mermaid API</span></summary>
        <div class="opts-list" id="opts-list"></div>
      </details>
      <details class="section" open>
        <summary class="panel-head">输出</summary>
        <div class="outputs">
          <div class="out-head">.pele CSS</div>
          <pre class="out" id="out-css"></pre>
          <div class="out-head">pele.mount / render 选项 (JSON)</div>
          <pre class="out" id="out-opts"></pre>
        </div>
      </details>
    </aside>

    <section class="board-panel">
      <div class="board-toolbar">
        <button type="button" id="btn-fit" title="全部显示 (F)">全部显示</button>
        <button type="button" class="secondary icon" id="btn-zoom-out" title="缩小 (-)">−</button>
        <span class="zoom-label" id="zoom-label">100%</span>
        <button type="button" class="secondary icon" id="btn-zoom-in" title="放大 (+)">+</button>
        <button type="button" class="secondary" id="btn-zoom-100" title="1:1">100%</button>
        <label class="frame-pick">聚焦
          <select id="frame-select"><option value="">— 选择图表 —</option></select>
        </label>
        <button type="button" class="secondary" id="btn-prev" title="上一个 (←)">‹</button>
        <button type="button" class="secondary" id="btn-next" title="下一个 (→)">›</button>
        <button type="button" class="secondary" id="btn-overview" title="返回总览 (Esc)">返回总览</button>
        <span class="hint">拖拽平移 · 滚轮/捏合缩放 · 点标题聚焦 · Esc 返回</span>
      </div>
      <div class="viewport theme-root" id="theme-root" tabindex="0">
        <div class="world" id="world"></div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <script src="./vendor/pele.global.js"></script>
  <script src="./diagrams/bundle.js"></script>
  <script src="./tweakpele.js"></script>
</body>
</html>
